services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - doacaocuba

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - doacaocuba

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
    command: php artisan queue:work --tries=3 --sleep=3
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - doacaocuba

  # Credentials here must match DB_DATABASE/DB_USERNAME/DB_PASSWORD in
  # backend/.env — compose does not interpolate values from env_file:,
  # only from a .env at this file's own location, so they're set directly.
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=doacaocuba
      - MYSQL_USER=doacaocuba
      - MYSQL_PASSWORD=doacaocuba
      - MYSQL_ROOT_PASSWORD=doacaocuba
      - TZ=America/Sao_Paulo
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdoacaocuba"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - doacaocuba

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - doacaocuba

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./dist:/var/www/dist:ro
      - ./docker/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - doacaocuba

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"
    restart: "no"
    networks:
      - doacaocuba

  certbot:
    image: certbot/certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks:
      - doacaocuba

networks:
  doacaocuba:
    driver: bridge

volumes:
  db_data_prod:
