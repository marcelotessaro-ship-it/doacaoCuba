opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Prod: code is cached, not re-read per request. Deploys must restart the
; app container (deploy-full does) so the cache picks up the new code.
opcache.validate_timestamps=0
