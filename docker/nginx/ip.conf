# Production config for access by bare IP (no domain, no TLS).
# Used by `make deploy-first-ip` when there's no domain yet — Let's
# Encrypt cannot issue certificates for an IP address, so this config
# serves plain HTTP only. Swap to a domain + `make deploy-first` later
# for HTTPS.

server {
    listen 80;
    server_name __IP__;

    client_max_body_size 20m;

    root /var/www/dist;
    index index.html;

    # Laravel API — front controller pattern, proxied to php-fpm.
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
        }
    }

    # React SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # Fingerprinted build assets — long cache, no access log noise.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico)$ {
        root /var/www/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never serve dotfiles (.env, .git, etc.), except the acme-challenge path.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
