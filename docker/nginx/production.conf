# Production config — decoupled SPA (React build in /var/www/dist) + API
# (Laravel front controller under /api/, proxied to the app php-fpm
# container). Swapped in from initial.conf by `make deploy-first` once
# the TLS certificate exists; used as-is by every `make deploy` after.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    client_max_body_size 20m;

    root /var/www/dist;
    index index.html;

    # Laravel API — front controller pattern, proxied to php-fpm.
    # try_files falls back to a NAMED location (@api_php) instead of a
    # nested `location ~ \.php$` — a nested regex location only matches
    # requests whose original URI still falls under /api/, but try_files'
    # internal redirect rewrites the URI to bare /index.php, which no
    # longer matches /api/. That silently routed every API call into the
    # SPA fallback below (GET got index.html back instead of JSON; POST
    # got a raw nginx 405 since the static file handler rejects non-GET).
    # Named locations bypass re-matching entirely, so this is safe.
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ @api_php;
    }

    location @api_php {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # React SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # Fingerprinted build assets — long cache, no access log noise.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|ico)$ {
        root /var/www/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never serve dotfiles (.env, .git, etc.), except the acme-challenge path.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
