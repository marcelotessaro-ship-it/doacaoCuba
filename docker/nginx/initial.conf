# Bootstrap config used before a TLS certificate exists (make deploy-first).
# HTTP only — lets certbot complete its webroot challenge, then
# deploy-first swaps this out for production.conf and reloads nginx.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "doacaoCuba — aguardando emissão do certificado TLS.\n";
        add_header Content-Type text/plain;
    }
}
